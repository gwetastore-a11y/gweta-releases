name: Notify Discord on Release

# Kirim notifikasi ke Discord setiap ada rilis baru (dipicu otomatis saat
# electron-builder --publish always membuat GitHub Release di repo ini).
# Webhook URL disimpan sebagai repo secret DISCORD_WEBHOOK_URL, tidak pernah
# ditulis langsung di file ini (repo ini publik).
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const release = context.payload.release;
            const body = (release.body || "").slice(0, 3800);
            // Tulis catatan rilis di GitHub pakai format ini supaya tampil rapi di
            // Discord: "✅ Fitur Ditambahkan", "🛠️ Diperbaiki", "🗑️ Dihapus", tiap
            // baris diawali "• ". Kalau catatan kosong, tampilkan pesan default.
            const embed = {
              title: `🚀 Gweta Store ${release.tag_name}`,
              url: release.html_url,
              description: body || "_Tidak ada catatan rilis._",
              color: 0xFFD700,
              footer: { text: "Gweta Store" },
            };

            const res = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username: "Gweta Store Updates", embeds: [embed] }),
            });

            if (!res.ok) {
              core.setFailed(`Discord webhook gagal: HTTP ${res.status}`);
            }

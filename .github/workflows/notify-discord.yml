name: Notify Discord on Release

# Kirim notifikasi ke Discord setiap ada rilis baru (dipicu otomatis saat
# electron-builder --publish always membuat GitHub Release di repo ini).
# Webhook URL disimpan sebagai repo secret DISCORD_WEBHOOK_URL, tidak pernah
# ditulis langsung di file ini (repo ini publik).
on:
  release:
    types: [published]
  # Supaya bisa dites manual dari tab Actions ("Run workflow") tanpa perlu
  # bikin rilis baru sungguhan — dipakai payload contoh di bawah kalau tidak
  # ada context.payload.release (mis. dipicu manual, bukan dari event release).
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const release = context.payload.release || {
              tag_name: "v0.0.0-test",
              html_url: "https://github.com/gwetastore-a11y/gweta-releases",
              body: "✅ **Fitur Ditambahkan**\n• Ini pesan tes manual dari tombol Run workflow.",
            };
            const body = (release.body || "").slice(0, 3800);
            // Tulis catatan rilis di GitHub pakai format ini supaya tampil rapi di
            // Discord: "✅ Fitur Ditambahkan", "🛠️ Diperbaiki", "🗑️ Dihapus", tiap
            // baris diawali "• ". Kalau catatan kosong, tampilkan pesan default.
            const embed = {
              title: `🚀 Gweta Store ${release.tag_name}`,
              url: release.html_url,
              description: body || "_Tidak ada catatan rilis._",
              color: 0xFFD700,
              footer: { text: "Gweta Store" },
            };

            // .trim() — secret dari GitHub UI kadang kebawa spasi/baris baru tak
            // kelihatan waktu di-paste, bikin new URL() di dalam fetch() gagal
            // dengan "Invalid URL" walau nilainya kelihatan benar (2026-07-30,
            // gagal di rilis v1.0.61, root cause ini).
            const webhookUrl = (process.env.DISCORD_WEBHOOK_URL || "").trim();
            if (!webhookUrl) {
              core.setFailed("DISCORD_WEBHOOK_URL kosong — cek repo secret di Settings > Secrets and variables > Actions.");
              return;
            }

            const res = await fetch(webhookUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username: "Gweta Store Updates", embeds: [embed] }),
            });

            if (!res.ok) {
              core.setFailed(`Discord webhook gagal: HTTP ${res.status}`);
            }

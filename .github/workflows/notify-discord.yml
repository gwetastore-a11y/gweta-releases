name: Notify Discord on Release

# Kirim notifikasi ke Discord setiap ada rilis baru (dipicu otomatis saat
# electron-builder --publish always membuat GitHub Release di repo ini).
# Webhook URL disimpan sebagai repo secret DISCORD_WEBHOOK_URL, tidak pernah
# ditulis langsung di file ini (repo ini publik).
on:
  release:
    types: [published]
  # Supaya bisa dites manual dari tab Actions ("Run workflow") tanpa perlu
  # bikin rilis baru sungguhan — dipakai payload contoh di bawah kalau tidak
  # ada context.payload.release (mis. dipicu manual, bukan dari event release).
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const release = context.payload.release || {
              tag_name: "v0.0.0-test",
              html_url: "https://github.com/gwetastore-a11y/gweta-releases",
              body: "✅ **Fitur Ditambahkan**\n• Ini pesan tes manual dari tombol Run workflow.",
            };
            // Catatan rilis BELUM ada saat event ini terpicu: electron-builder
            // mempublikasikan rilis tanpa body, lalu scripts/set-release-notes.cjs
            // (hook postrelease:win di app) baru menempelkan catatannya ~30 detik
            // kemudian. Akibatnya v1.0.106 terkirim ke Discord sebagai "Tidak ada
            // catatan rilis" (2026-11-16). Jadi body diambil ulang dari API sampai
            // terisi, maksimal ~4 menit; lewat dari itu tetap kirim apa adanya.
            let notes = release.body || "";
            if (!notes.trim() && release.id) {
              for (let i = 0; i < 24 && !notes.trim(); i++) {
                await new Promise((r) => setTimeout(r, 10000));
                try {
                  const { data } = await github.rest.repos.getRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: release.id,
                  });
                  notes = data.body || "";
                } catch (e) {
                  console.log(`[notes] gagal ambil ulang rilis (percobaan ${i + 1}): ${e.message}`);
                }
              }
              console.log(`[notes] catatan rilis ${notes.trim() ? "ditemukan" : "TETAP kosong setelah menunggu"}`);
            }
            const body = notes.slice(0, 3800);
            // Tulis catatan rilis di GitHub pakai format ini supaya tampil rapi di
            // Discord: "✅ Fitur Ditambahkan", "🛠️ Diperbaiki", "🗑️ Dihapus", tiap
            // baris diawali "• ". Kalau catatan kosong, tampilkan pesan default.
            const embed = {
              title: `🚀 Gweta Store ${release.tag_name}`,
              url: release.html_url,
              description: body || "_Tidak ada catatan rilis._",
              color: 0xFFD700,
              footer: { text: "Gweta Store" },
            };

            // .trim() — secret dari GitHub UI kadang kebawa spasi/baris baru tak
            // kelihatan waktu di-paste, bikin new URL() di dalam fetch() gagal
            // dengan "Invalid URL" walau nilainya kelihatan benar (2026-07-30,
            // gagal di rilis v1.0.61, root cause ini).
            const webhookUrl = (process.env.DISCORD_WEBHOOK_URL || "").trim();

            // Diagnostik AMAN (tidak pernah nge-print isi secret, cuma metadata
            // tentang bentuknya) — dipasang 2026-07-31 setelah .trim() saja
            // ternyata tidak cukup menyelesaikan error "Failed to parse URL" di
            // v1.0.62, supaya bisa didiagnosis dari log tanpa membocorkan secret.
            console.log(`[debug] panjang webhookUrl setelah trim: ${webhookUrl.length}`);
            console.log(`[debug] diawali prefix webhook Discord yang benar: ${webhookUrl.startsWith("https://discord.com/api/webhooks/") || webhookUrl.startsWith("https://discordapp.com/api/webhooks/")}`);
            console.log(`[debug] masih mengandung whitespace di tengah: ${/\s/.test(webhookUrl)}`);

            if (!webhookUrl) {
              core.setFailed("DISCORD_WEBHOOK_URL kosong — cek repo secret di Settings > Secrets and variables > Actions.");
              return;
            }

            try {
              new URL(webhookUrl);
            } catch {
              core.setFailed(`DISCORD_WEBHOOK_URL bukan URL yang valid (panjang=${webhookUrl.length}). Kemungkinan salah salin dari Discord (kebawa tanda kutip/teks lain, atau tidak lengkap) — hapus secret ini di Settings > Secrets and variables > Actions, lalu buat ulang dengan menyalin ulang URL webhook langsung dari Discord (Server Settings > Integrations > Webhooks > Copy Webhook URL).`);
              return;
            }

            const res = await fetch(webhookUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ username: "Gweta Store Updates", embeds: [embed] }),
            });

            if (!res.ok) {
              core.setFailed(`Discord webhook gagal: HTTP ${res.status}`);
            }
